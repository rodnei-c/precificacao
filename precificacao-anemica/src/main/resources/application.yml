spring:
  application:
    name: precificacao-anemica
  config:
    import:
      - "optional:file:./.env.anemico[.properties]"
      - "optional:file:./precificacao-anemica/.env.anemico[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/precificacao_anemica}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
