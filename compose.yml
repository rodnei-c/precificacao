services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: precificacao_anemica
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD antes de iniciar o PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-postgres-anemico:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-postgres-anemico:
